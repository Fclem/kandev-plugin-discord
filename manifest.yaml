# kandev-plugin-discord manifest — the declarative contract between this plugin
# and a kandev host. `id` MUST match go.mod's module line, the Makefile BIN
# name, and the id passed to window.registerKandevPlugin(...) in ui/bundle.js.
#
# Design: docs/design/requirements.md and docs/design/system-design.md
# (mirrors of kdlbs/kandev docs/specs/integrations/*/discord.md) and
# docs/design/plan.md.
id: "kandev-plugin-discord"
api_version: 2
version: "0.1.0"
display_name: "Discord"
description: "One Discord channel per Kandev task: agent updates in the channel, channel messages delivered to the task, and /status, /stop, /approve, /deny, /link slash commands."
author: "Fclem"
categories: ["connector"]
repo_url: "https://github.com/Fclem/kandev-plugin-discord"

# Host APIs merged in kdlbs/kandev#5438 (CancelTurn, linked accounts, step
# approval, Message.Source) first ship in Kandev 0.104.0, with pluginsdk and
# @kdlbs/plugin-sdk 0.5.0.
min_kandev_version: "0.104.0"

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

# Events are triggers only; content is read through Messages().List. The
# plugin never subscribes to message.* (one event per streamed chunk).
# Host v2 grants a workspace manager approves in Settings > Plugins >
# Workspace access: host.v2.read:{sessions,interactions} for execution IDs and
# interaction revisions, host.v2.write:execution for /stop and step approval,
# host.v2.write:interactions and host.v2.write:human_responses for /link and
# approvals by linked Kandev users.
capabilities:
  events:
    - "task.created"
    - "task.updated"
    - "task.state_changed"
    - "task.deleted"
    - "task.moved"
    - "turn.completed"
    - "task_session.state_changed"
    - "message.queue.status_changed"
    - "permission_request.received.*"
    - "clarification.answered"
    - "clarification.cancelled"
  api_read: ["tasks", "sessions", "messages", "interactions", "workflows"]
  api_write: ["messages", "execution", "interactions", "human_responses"]
  state: true

# Host-authenticated browser actions for the settings card. Kandev enforces
# the admin role before the plugin sees the request. connection.test calls
# Discord; connection.status returns the cached gateway health only.
actions:
  - key: "connection.test"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 1024
  - key: "connection.status"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 1024

ui:
  bundle: "/ui/bundle.js"

# Operator settings, rendered at Settings > Plugins > Discord. Saving restarts
# the plugin. Secret fields are vault-stored and masked outside the plugin.
config_schema:
  type: object
  properties:
    bot_token:
      type: string
      secret: true
      title: "Bot token"
      description: "Discord Developer Portal > your application > Bot > Reset Token."
    application_id:
      type: string
      title: "Application ID"
      description: "Discord Developer Portal > your application > General Information > Application ID."
    workspace_guilds:
      type: string
      title: "Workspace → server bindings"
      description: "One `<kandev workspace id>=<discord server id>` pair per line (or comma-separated). Each workspace and each server may appear once."
    operator_role_name:
      type: string
      title: "Operator role"
      description: "Discord role allowed to message tasks and run /stop and /approve."
      default: "Kandev Operator"
    viewer_role_name:
      type: string
      title: "Viewer role (optional)"
      description: "Discord role that may read task channels but not write."
    allowed_user_ids:
      type: string
      title: "Extra operator user IDs (optional)"
      description: "Comma-separated Discord user IDs treated as operators without the role."
    kandev_base_url:
      type: string
      title: "Kandev base URL (optional)"
      description: "Public URL of this Kandev instance, used for deep links in channel topics."
    close_trigger:
      type: string
      title: "Close channels when"
      enum: ["archived", "terminal"]
      default: "archived"
    closed_channel_action:
      type: string
      title: "Closed channel action"
      enum: ["archive", "delete"]
      default: "archive"
    archive_retention_days:
      type: integer
      title: "Archive retention (days, 0 = keep)"
      default: 30
    mirror_user_messages:
      type: boolean
      title: "Mirror Kandev user messages to Discord"
      default: true
    post_tool_activity:
      type: boolean
      title: "Post tool-call summaries"
      default: false
    live_update_interval_seconds:
      type: integer
      title: "Mid-turn update interval (seconds, 0 = turn end only)"
      default: 30
    inbound_catchup_max_age_minutes:
      type: integer
      title: "Deliver missed Discord messages up to (minutes)"
      default: 15
    include_ephemeral_tasks:
      type: boolean
      title: "Include quick-chat tasks"
      default: false
  required: ["bot_token", "application_id", "workspace_guilds"]
